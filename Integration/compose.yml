name: nidaa-integration
x-client: &client
  build:
    context: ..
    dockerfile: Integration/Dockerfile
  image: nidaa-integration-client:local
  networks: [isolated]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  environment: &env
    DATABASE_URL: postgresql://nidaa_service:${SERVICE_DB_PASSWORD}@db:5432/postgres
    AUTH_URL: http://auth:9999
    AUTH_ISSUER: http://127.0.0.1:55421/auth/v1
    JWT_SECRET: ${JWT_SECRET}
    RECEIPT_KEY: ${RECEIPT_KEY}
services:
  db:
    image: postgres:17.6-bookworm
    networks: [isolated]
    ports: ['127.0.0.1:55432:5432']
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-auth.sh:/docker-entrypoint-initdb.d/00-auth.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 40
    command: ['postgres', '-c', 'log_statement=none', '-c', 'log_min_error_statement=panic']
  mail:
    image: axllent/mailpit:v1.31.3
    networks: [isolated]
    ports: ['127.0.0.1:55424:8025']
    environment:
      MP_MAX_MESSAGES: 1000
      MP_SMTP_AUTH_ACCEPT_ANY: 'false'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'false'
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_QUIET: 'true'
  auth:
    image: supabase/gotrue:v2.196.0
    networks: [isolated]
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_started}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:55421/auth/v1
      GOTRUE_SITE_URL: http://127.0.0.1:55421/verified
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:55421/verified
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_auth_admin:${AUTH_DB_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: http://127.0.0.1:55421/auth/v1
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_MAILER_OTP_EXP: 300
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@example.invalid
      GOTRUE_SMTP_SENDER_NAME: NIDAA local trial
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_RATE_LIMIT_VERIFY: 1000
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 1000
      GOTRUE_RATE_LIMIT_SIGN_IN_SIGN_UP: 1000
      GOTRUE_RATE_LIMIT_OTP: 1000
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_LOG_LEVEL: error
      LOG_LEVEL: error
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://localhost:9999/health']
      interval: 2s
      timeout: 3s
      retries: 40
  service:
    <<: *client
    depends_on:
      auth: {condition: service_healthy}
  gateway:
    <<: *client
    environment: {}
    command: ['python', '-m', 'uvicorn', 'Integration.gateway:app', '--host', '0.0.0.0', '--port', '8080', '--no-access-log', '--log-level', 'error']
    ports: ['127.0.0.1:55421:8080']
    depends_on:
      service: {condition: service_started}
  bootstrap:
    <<: *client
    profiles: [tools]
    environment:
      <<: *env
      DATABASE_ADMIN_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/postgres
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD}
    command: ['python', '-m', 'Integration.bootstrap']
  tests:
    <<: *client
    profiles: [tools]
    environment:
      <<: *env
      DATABASE_ADMIN_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/postgres
      AUTH_ADMIN_TOKEN: ${AUTH_ADMIN_TOKEN}
      BASE_URL: http://gateway:8080
      MAIL_URL: http://mail:8025
    command: ['python', '-m', 'unittest', 'discover', '-s', 'Integration/tests', '-v']
  worker:
    <<: *client
    profiles: [tools]
    environment:
      <<: *env
      AUTH_ADMIN_TOKEN: ${AUTH_ADMIN_TOKEN}
    command: ['python', '-m', 'Integration.service.worker', 'dispatch']
networks:
  isolated:
    internal: true
volumes:
  db-data:
