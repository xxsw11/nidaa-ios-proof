name: NIDAA - iOS Simulator Proof

on:
  workflow_dispatch:
    inputs:
      ui_suite:
        description: 'Run only the affected suite after diagnosis, or all regression suites'
        required: false
        type: choice
        default: all
        options: [all, integration, local-a, local-b]
  push:
    branches: [main, 'codex/**']
    paths:
      - 'App/**'
      - 'ProofCore/**'
      - 'IntegrationClient/**'
      - 'Config/**'
      - 'NidaaProof.xcodeproj/**'
      - 'Scripts/**'
      - 'QA/test_payload.py'
      - 'QA/test_native_stage.py'
      - 'UITests/**'
      - '.github/workflows/ios-simulator.yml'

permissions:
  contents: read

concurrency:
  group: nidaa-ios-proof-${{ github.ref }}-${{ inputs.ui_suite || (contains(github.event.head_commit.message, '[ui:integration]') && 'integration') || 'all' }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Simulator - ${{ matrix.ui-suite }}
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Explicit narrow reruns retain prior same-source local-a/local-b evidence;
        # ordinary pushes still select every regression suite.
        ui-suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.ui_suite != 'all' && format('["{0}"]', inputs.ui_suite) || contains(github.event.head_commit.message, '[ui:integration]') && '["integration"]' || '["integration","local-a","local-b"]') }}
    env:
      NIDAA_UI_SUITE: ${{ matrix.ui-suite }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record environment
        run: |
          mkdir -p artifacts
          { sw_vers; xcodebuild -version; swift --version; } > artifacts/environment.txt
          xcrun simctl list devices available -j > artifacts/devices.json
      - name: Run offline payload tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s QA -p 'test_*.py' -v 2>&1 | tee artifacts/python-tests.log
      - name: Run Swift core tests on macOS
        run: |
          set -o pipefail
          swift test --package-path ProofCore 2>&1 | tee artifacts/swift-tests.log
          swift test --package-path IntegrationClient 2>&1 | tee artifacts/swift-client-tests.log
      - name: Test local SwiftUI journey and build Release
        timeout-minutes: 30
        run: |
          if [[ "$NIDAA_UI_SUITE" == integration ]]; then
            bash Scripts/ci_native_review.sh integration
          else
            bash Scripts/ci_simulator.sh
          fi
      - name: Upload logs and simulator evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nidaa-simulator-${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.ui-suite }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
      - name: Write honest run summary
        if: ${{ always() }}
        env:
          RUN_RESULT: ${{ job.status }}
        run: |
          {
            echo '# NIDAA simulator proof'
            echo "Job status before this summary: $RUN_RESULT"
            echo 'See each step and uploaded logs for actual outcomes.'
            echo 'Swift package tests run on macOS. The app build/launch targets iOS Simulator.'
            echo 'No physical iPhone, APNs delivery, Face ID hardware, sound routing, flashlight or Critical Alerts test was performed.'
            echo 'Native local simulation UI tests and screenshots are separate from physical-device validation.'
            echo 'No real notification or APNs test is authorized in this stage.'
          } >> "$GITHUB_STEP_SUMMARY"
