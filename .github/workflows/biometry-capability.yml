name: NIDAA - Bounded Simulator biometry capability
on:
  push:
    branches: ['codex/biometry-capability']
    paths: ['Diagnostics/matching_autofill_probe.py', 'Diagnostics/controlled_matching_run.py', 'Diagnostics/matching_face_stream.py', 'Diagnostics/biometry_matching_helper.py', 'Diagnostics/test_matching_diagnostic.py', 'Diagnostics/enrolled_autofill_probe.py', 'Diagnostics/biometry_enrolled_helper.py', 'Diagnostics/early_passwords_entry_validator.py', 'Diagnostics/xctest_biometry_probe.py', 'UITests/AutoFillUITests.swift', 'Diagnostics/intel_host_capability.py', 'Diagnostics/biometry_probe.py', '.github/workflows/biometry-capability.yml']
permissions:
  contents: read
jobs:
  capability:
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/codex/biometry-capability' && !contains(github.event.head_commit.message, '[diagnostic:host-only]') }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record exact source
        run: python3 Scripts/record_ci_source.py
      - name: Check bounded one-shot diagnostic transport
        run: python3 -m unittest discover -s Diagnostics -p test_matching_diagnostic.py -v
      - name: Test one official matching response after native Passwords tap
        run: python3 Diagnostics/matching_autofill_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: enrolled-autofill-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/source.json
            artifacts/enrolled-autofill/report.json
            artifacts/native-review/autofill-saved/result.json
            artifacts/native-review/autofill-saved/early-passwords-entry.json
            artifacts/native-review/autofill-saved/picker-accessibility-before_tap.json
            artifacts/native-review/autofill-saved/picker-accessibility-after_tap.json
            artifacts/native-review/autofill-saved/picker-accessibility-selection_failure.json
          retention-days: 7
  intel-host:
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/codex/biometry-capability' && contains(github.event.head_commit.message, '[diagnostic:host-only]') }}
    runs-on: macos-15-intel
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read actual host capability without services or credentials
        run: python3 Diagnostics/intel_host_capability.py --output artifacts/intel-host-capability/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: intel-host-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/intel-host-capability/report.json
          retention-days: 7
